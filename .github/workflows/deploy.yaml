name: Despliegue Portfolio a GitHub Pages

on:
    push:
        branches: ["main"]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        environment:
            name: github-pages

        # Ya no necesitamos 'packages: read'
        permissions:
            contents: read
            pages: write
            id-token: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Instalar Dependencias Restantes (Si hay otras)
              run: npm install

            - name: Limpiar Caché de Vite y Compilación Anterior
              run: |
                  # Necesario para que Vite genere el build limpio
                  rm -rf .vite
                  rm -rf dist

            - name: Build with Vite
              run: npm run build

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Upload production artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: "./dist"

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
